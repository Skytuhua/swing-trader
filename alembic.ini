# =============================================================================
# Alembic Configuration for SwingTrader
# =============================================================================
# Documentation: https://alembic.sqlalchemy.org/en/latest/tutorial.html
# =============================================================================

[alembic]
# Path to migration scripts, relative to this file.
script_location = alembic

# Template to use when generating new migration files.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sys.path modification: ensure src/ is importable when running alembic CLI.
prepend_sys_path = .

# Timezone for the %%(year)d ... variables in file_template.
# timezone =

# Maximum column width in generated scripts (0 = unlimited).
# truncate_slug_length = 40

# Set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# Version location specification; This defaults
# to alembic/versions. When using multiple version
# directories, initial revisions must be specified with --version-path.
# The path separator used here should be the separator specified by "version_path_separator" below.
# version_locations = %(here)s/bar:%(here)s/bat:alembic/versions

# version path separator; As mentioned above, this is the character used to split
# version_locations. The default within new alembic.ini files is "os", which uses
# os.pathsep. Note that this was different in older versions of alembic.
# version_path_separator = os  # Use os.pathsep. Default.
# version_path_separator = :   # Use the colon ":"  separator for *nix systems
# version_path_separator = ;   # Use the semicolon ";"  separator for Windows systems
# version_path_separator = space  # Use the space " "  separator

# ---------------------------------------------------------------------------
# Database URL
# ---------------------------------------------------------------------------
# The database URL is read at runtime from the DATABASE_URL environment
# variable inside alembic/env.py — the value here is only used as a
# fallback and should point to your local development database.
#
# For async engines (asyncpg) the URL uses the +asyncpg driver.
# Alembic's sync env.py wrapper replaces it with +psycopg2 for migrations.
sqlalchemy.url = postgresql://swing:swing@localhost:5432/swingtrader

# ---------------------------------------------------------------------------
# Logging configuration
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
